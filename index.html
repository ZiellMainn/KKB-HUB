<style>
:root{
  /* KKB-HUB: wad hospital yang hangat. Krim kertas, merah salib KKB, maroon gelap, mint scrub. Layout: rel kiri + bento kad bulat. */
  --cream:#FFF4E8; --paper:#FFFCF7; --red:#D3343A; --maroon:#5E1A20; --mint:#9ED9C8; --mint-deep:#23806F;
  --butter:#FFD372; --ink:#2B1518; --muted:#8B6A66; --line:#EBD9CC;
  --display:"Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --body:"DM Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
  --shadow:0 1px 0 rgba(94,26,32,.06), 0 10px 24px -14px rgba(94,26,32,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
@media (max-width:900px){html,body{height:auto;min-height:100%}}
body{background:var(--cream);color:var(--ink);font:15px/1.5 var(--body);
  background-image:radial-gradient(circle at 1px 1px, rgba(94,26,32,.07) 1px, transparent 0);background-size:22px 22px}
h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(28px,4vw,42px);font-weight:800}
h2{font-size:26px;font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px;border-radius:10px}
.mono{font-family:var(--mono);font-size:13px}
.muted{color:var(--muted)}
.hide{display:none!important}

/* ---------- buttons, chips, inputs ---------- */
.btn{border:0;cursor:pointer;border-radius:999px;padding:10px 18px;font-weight:700;background:var(--ink);color:var(--paper);
  display:inline-flex;align-items:center;gap:8px;transition:transform .15s ease, box-shadow .15s ease, background .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px -8px rgba(43,21,24,.5)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.red{background:var(--red)} .btn.mint{background:var(--mint-deep)} .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--line)}
.btn.butter{background:var(--butter);color:var(--ink)} .btn.sm{padding:6px 12px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line);white-space:nowrap}
.chip.red{background:#FBE0DF;box-shadow:none;color:#9B1F25}.chip.mint{background:#DDF3EC;box-shadow:none;color:#155E51}
.chip.butter{background:#FFF0C8;box-shadow:none;color:#7A5300}.chip.maroon{background:var(--maroon);color:#fff;box-shadow:none}
.field{display:grid;gap:6px}
.field label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=datetime-local],input[type=time],input[type=number],select,textarea{
  width:100%;border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:10px 13px;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
textarea{resize:vertical;min-height:84px}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:260px 1fr;height:100%}
.rail{background:var(--maroon);color:#FBE9E3;margin:14px 0 14px 14px;border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden;position:relative}
.rail .brand{display:flex;align-items:center;gap:10px;padding:20px 18px 12px}
.brand-logo{width:52px;height:52px;object-fit:contain;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35));transition:transform .3s}
.brand:hover .brand-logo{transform:rotate(-8deg) scale(1.08)}
.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--red);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.brand-name{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand-sub{font-size:11px;opacity:.7;letter-spacing:.08em;text-transform:uppercase}
.nav{flex:1;overflow:auto;padding:4px 12px 12px}
.nav-group{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.55;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;color:inherit;text-decoration:none;font-weight:500;position:relative;transition:background .15s, transform .15s}
.nav a:hover{background:rgba(255,255,255,.08);transform:translateX(3px)}
.nav a.on{background:var(--cream);color:var(--maroon);font-weight:700}
.nav .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:15px;flex:none}
.nav a.on .ico{background:#FBE0DF}
.nav .badge{margin-left:auto;background:var(--butter);color:var(--ink);border-radius:999px;font-size:11px;font-weight:800;padding:1px 8px}
.rail .me{margin:10px;background:rgba(255,255,255,.08);border-radius:20px;padding:10px;display:flex;gap:10px;align-items:center}
.rail .me b{display:block;font-size:14px;line-height:1.2}
.rail-btn{width:34px;height:34px;border-radius:11px;font-size:14px;background:rgba(255,255,255,.12);box-shadow:none;flex:none}
@media (min-width:901px){.rail .rail-btn{display:none}}
.main{overflow:auto;padding:14px 22px 40px}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 0 18px;flex-wrap:wrap}
.topbar .grow{flex:1;min-width:0}
.ecg{height:28px;width:150px}
.ecg path{stroke:var(--red);stroke-width:2.4;fill:none;stroke-dasharray:240;animation:ecg 2.4s linear infinite}
@keyframes ecg{from{stroke-dashoffset:240}to{stroke-dashoffset:-240}}
.iconbtn{width:40px;height:40px;border-radius:14px;border:0;background:var(--paper);box-shadow:inset 0 0 0 2px var(--line);cursor:pointer;display:grid;place-items:center;font-size:17px;transition:transform .15s}
.iconbtn:hover{transform:rotate(-6deg) scale(1.06)}
.page{animation:pageIn .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{transform:translateY(12px);opacity:.3}to{transform:none;opacity:1}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--paper);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);position:relative}
.card.red{background:var(--red);color:#fff}.card.maroon{background:var(--maroon);color:#FBE9E3}.card.mint{background:var(--mint)}.card.butter{background:var(--butter)}
.card.flat{box-shadow:inset 0 0 0 2px var(--line);background:transparent}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h .grow{flex:1}
.tilt{transition:transform .25s ease}
.tilt:hover{transform:translateY(-4px) rotate(-.4deg)}
.page-h{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.page-h .grow{flex:1;min-width:240px}
.page-h p{margin-top:6px;max-width:62ch}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sep{height:2px;background:var(--line);border-radius:2px;margin:14px 0}
.list{display:grid;gap:8px}
.li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--cream)}
.li .grow{flex:1;min-width:0}
.empty{padding:22px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px}
.tabs{display:inline-flex;background:var(--paper);padding:5px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--line);gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--red);color:#fff}
.ol{margin:0;padding-left:0;list-style:none;counter-reset:n;display:grid;gap:10px}
.ol li{counter-increment:n;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.ol li::before{content:counter(n);width:30px;height:30px;border-radius:10px;background:#FBE0DF;color:#9B1F25;font-weight:800;display:grid;place-items:center;font-size:13px}
table{border-collapse:separate;border-spacing:0;width:100%}
.tbl-wrap{overflow-x:auto;border-radius:20px;box-shadow:inset 0 0 0 2px var(--line)}
.tbl th{position:sticky;top:0;background:var(--maroon);color:#FBE9E3;text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:12px;font-weight:700}
.tbl td{padding:10px 12px;border-top:2px solid var(--line);vertical-align:top;background:var(--paper)}
.tbl th.kp{background:var(--red)} .tbl th.tp{background:var(--mint-deep)}
.num{font-variant-numeric:tabular-nums}

/* avatar */
.av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;font-family:var(--display);overflow:hidden;box-shadow:0 0 0 3px var(--paper)}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;font-size:34px;box-shadow:0 0 0 5px var(--paper)}
.av.sm{width:28px;height:28px;font-size:12px;box-shadow:none}

/* stars */
.stars{display:inline-flex;gap:2px}
.stars button{border:0;background:none;cursor:pointer;font-size:20px;line-height:1;padding:2px;color:#E5D3C6;transition:transform .12s}
.stars button.on{color:#F2A900}
.stars button:hover{transform:scale(1.25) rotate(-8deg)}
.stars.ro button{cursor:default}.stars.ro button:hover{transform:none}

/* ---------- login ---------- */
#app{height:100%}
.login{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(380px,1fr);min-height:100%;max-width:1480px;margin:0 auto;gap:0}
.login-art{position:relative;background:radial-gradient(120% 90% at 85% 20%,#8A232B 0%,var(--maroon) 55%,#3E1014 100%);margin:16px;border-radius:36px;overflow:hidden;min-height:560px}
.login-art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1px,transparent 0);background-size:22px 22px}
.login-art canvas{position:absolute;inset:0;width:100%;height:100%}
.login-art .cap{position:absolute;left:40px;bottom:40px;max-width:min(520px,52%);color:#FBE9E3;display:grid;gap:12px;justify-items:start}
.login-art .cap h1{font-size:clamp(44px,5.4vw,84px);color:#fff;line-height:.95}
.login-side{display:grid;place-items:center;padding:24px 32px}
.login-card{width:min(420px,100%);display:grid;gap:16px}
.login-card .tagline{font-family:var(--display);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);font-weight:800}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ---------- dashboard ---------- */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.hero-main{min-height:230px;overflow:hidden}
.hero-main canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-main .txt{position:relative;max-width:56%;display:grid;gap:10px}
.kawal-mini .slot{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1.5px dashed rgba(255,255,255,.25)}
.kawal-mini .slot:last-child{border:0}
.day{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day div{border-radius:12px;padding:8px 2px;text-align:center;background:var(--cream);font-size:9.5px;font-weight:700;letter-spacing:.02em;overflow:hidden}
.day div b{display:block;font-family:var(--display);font-size:13px}
.day div.today{background:var(--red);color:#fff;transform:translateY(-3px)}
.day div.ev{box-shadow:inset 0 -4px 0 var(--butter)}
.pulse-dot{width:10px;height:10px;border-radius:50%;background:#3DDC97;box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:pulse 1.6s infinite}
@keyframes pulse{to{box-shadow:0 0 0 12px rgba(61,220,151,0)}}

/* ---------- bilik kawalan ---------- */
.board{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.monitor{background:#16090B;color:#FFE9E4;border-radius:var(--r-lg);padding:22px;position:relative;overflow:hidden;font-family:var(--mono)}
.monitor::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 4px);pointer-events:none}
.monitor h3{font-family:var(--mono);color:#7CF5C4;font-size:14px;letter-spacing:.1em}
.monitor .big{font-family:var(--display);font-size:30px;font-weight:800;color:#fff;margin:6px 0 12px}
.monitor .k{color:#FF8E8A;font-size:12px;letter-spacing:.08em}
.monitor .slots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px}
.monitor .v{color:#fff;font-size:14px;min-height:20px}

/* ---------- chat ---------- */
.chat{display:grid;grid-template-rows:1fr auto auto;height:calc(100vh - 170px);min-height:440px;background:#FFF8EE;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);
  background-image:linear-gradient(rgba(255,211,114,.16) 2px, transparent 2px),linear-gradient(90deg, rgba(255,211,114,.16) 2px, transparent 2px);background-size:46px 46px}
.chat-list{overflow:auto;padding:22px 18px;display:flex;flex-direction:column;gap:20px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:min(560px,86%);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bubble{position:relative;background:var(--paper);border:2.5px solid #F0C964;border-radius:26px 26px 26px 8px;padding:20px 18px 12px;min-width:120px}
.msg.me .bubble{border-radius:26px 26px 8px 26px}
.bubble::before{content:"";position:absolute;right:-6px;top:-8px;width:22px;height:22px;border-radius:50%;background:#FFF8EE}
.bubble .who{position:absolute;top:-13px;left:16px;background:var(--butter);border:2px solid #E9B53F;border-radius:999px;padding:1px 12px;font-size:12px;font-weight:800;white-space:nowrap}
.bubble .txt{font-weight:500;word-wrap:break-word}
.bubble .when{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:6px;align-items:center}
.bubble.r-lead{background:linear-gradient(120deg,#6E1A20,#D3343A);border-color:#9B1F25;color:#fff}
.bubble.r-lead .who{background:#FFB25C;border-color:#E08A2B}
.bubble.r-lead .when{color:#FFD8D0}
.bubble.r-hd{background:#E9F7F2;border-color:#7CC8B3}.bubble.r-hd .who{background:var(--mint);border-color:#6CB9A4}
.bubble.r-over{background:#F1ECFF;border-color:#B9A6F2}.bubble.r-over .who{background:#D9CCFF;border-color:#A891EE}
.bubble.sticker{background:transparent;border:0;padding:16px 0 0;font-size:46px}
.bubble.sticker::before{display:none}
.chat-in{display:flex;gap:8px;padding:12px;background:var(--paper);border-top:2px solid var(--line);align-items:center}
.chat-in input{border-radius:999px}
.stk{display:flex;gap:4px}
.stk button{border:0;background:var(--cream);border-radius:12px;width:38px;height:38px;cursor:pointer;font-size:19px;transition:transform .15s}
.stk button:hover{transform:translateY(-3px) rotate(8deg)}

/* ---------- profile ---------- */
.prof{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.prof-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.quote{background:#EFE6E2;border-radius:24px;padding:18px 20px;font-family:var(--display);font-size:18px;color:#5C4A47;text-align:center}
.emo-row{display:flex;gap:10px;font-size:28px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:30px;height:30px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.swatches button.on{box-shadow:0 0 0 3px var(--ink)}

/* ---------- org chart ---------- */
.org{display:grid;gap:14px;justify-items:center}
.org .lvl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative}
.org .node{background:var(--paper);border-radius:22px;padding:14px 16px;min-width:190px;max-width:290px;box-shadow:var(--shadow);border-top:6px solid var(--red)}
.org .node.kp{border-color:var(--maroon)}.org .node.tp{border-color:var(--red)}.org .node.hd{border-color:var(--mint-deep)}.org .node.sd{border-color:#E9A23B}.org .node.base{border-color:#C9B6AD}.org .node.over{border-color:#8D74E6}
.org .node h4{font-size:15px}
.org .node ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:#5C4A47}
.org .arrow{width:3px;height:18px;background:var(--line);border-radius:2px}

/* ---------- toast, modal ---------- */
.toasts{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:75;pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:16px;padding:11px 16px;font-weight:500;box-shadow:0 12px 24px -10px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-width:340px}
.toast.ok{background:var(--mint-deep)}.toast.err{background:var(--red)}
.modal-bg{position:fixed;inset:0;background:rgba(43,21,24,.45);display:grid;place-items:center;z-index:80;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border-radius:28px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.ring{--p:0;width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--mint-deep) calc(var(--p)*1%), var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:12px}
.copybox{display:flex;gap:8px;align-items:stretch}
.copybox code{flex:1;background:#1E0E10;color:#FFE5DF;border-radius:14px;padding:10px 12px;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;word-break:break-word}
.modeflag{font-size:12px}
.ann-list{display:grid;gap:10px}
.ann{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:20px;background:var(--cream);border-left:6px solid var(--mint-deep);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.ann.meet{border-left-color:var(--red)}
.ann.pin{background:#FFF4D6}
.ann-date{width:64px;height:68px;flex:none;border-radius:16px;background:var(--red);color:#fff;display:grid;place-items:center;align-content:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.ann-date b{font-family:var(--display);font-size:28px;line-height:1}
.ann-date span{font-size:11px;font-weight:800;letter-spacing:.08em}
.ann-date.gen{background:var(--mint)}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.note{border-radius:6px 22px 22px 22px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:170px;transform:rotate(var(--rot));box-shadow:0 1px 0 rgba(0,0,0,.04),0 10px 20px -14px rgba(94,26,32,.45);transition:transform .2s;position:relative}
.note::before{content:"";position:absolute;top:-8px;left:50%;width:56px;height:16px;margin-left:-28px;background:rgba(255,255,255,.55);border-radius:3px;transform:rotate(-3deg)}
.note:hover{transform:rotate(0) translateY(-3px)}
.note-txt{font-family:var(--display);font-size:16px;line-height:1.35;white-space:pre-wrap;word-wrap:break-word}
.react{border:0;background:rgba(255,255,255,.65);border-radius:999px;padding:3px 8px;cursor:pointer;font-size:14px;transition:transform .15s}
.react b{font-size:11px}
.react.on{background:var(--ink);color:#fff}
.react:hover{transform:scale(1.12)}
.react.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.35)}}
.tour{text-align:left;max-width:440px;position:relative;overflow:hidden}
.tour-bar{position:absolute;left:0;right:0;top:0;height:6px;background:var(--line)}
.tour-bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.tour-ico{font-size:52px;width:84px;height:84px;border-radius:26px;background:var(--cream);display:grid;place-items:center;margin:8px 0 12px;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@media (max-width:900px){.toasts{left:12px;right:12px;bottom:92px}.modal-bg{place-items:end center;padding:10px}.tour{max-width:none}.notes{grid-template-columns:1fr 1fr}.note{min-height:150px}.note-txt{font-size:14px}}
@media (max-width:420px){.notes{grid-template-columns:1fr}}
.pair-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;border-radius:16px;background:var(--cream)}
#backBox .pair-row{flex-wrap:nowrap;background:none;padding:0}
.pair-row input{min-width:0;flex:1 1 38%;padding:9px 11px}
.pair-row .pair-area{flex:1 1 calc(100% - 80px);margin-left:32px}
.pair-no{width:26px;height:26px;border-radius:9px;background:#FBE0DF;color:#9B1F25;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.pair-plus{font-weight:800;color:var(--muted)}
.pair-del{width:34px;height:34px;font-size:13px;flex:none}
.pair-del[disabled]{opacity:.3;pointer-events:none}
.kw-prev{white-space:pre-wrap;background:#2F3136;color:#DCDDDE;border-radius:12px;padding:12px 14px;font:12.5px/1.5 var(--mono);margin:0;max-height:260px;overflow:auto}
@media (max-width:900px){.pair-plus{display:none}.pair-row .pair-area{margin-left:0}}
.chat{position:relative}
.chat.drop{outline:3px dashed var(--red);outline-offset:-8px}
.chat-prev{display:flex;gap:10px;align-items:center;padding:8px 12px;background:#FFF0C8;border-top:2px solid var(--line)}
.chat-prev img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.chat-img{display:block;border:0;padding:0;margin:2px 0 6px;background:none;cursor:zoom-in;border-radius:16px;overflow:hidden;max-width:min(320px,100%)}
.chat-img img{display:block;width:100%;max-height:320px;object-fit:cover}
.stk .attach{background:var(--butter)}
.stat-sel{min-width:150px;font-weight:700}
.stat-aktif{border-color:#9ED9C8}.stat-cd{border-color:var(--butter);background:#FFF6DA}.stat-nonaktif{border-color:#F2B6B3;background:#FDECEB}
.endbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:16px;background:#FBE0DF}
.duty{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.duty.dash span{background:rgba(255,255,255,.12);color:#fff}
.duty span{font-variant-numeric:tabular-nums;background:rgba(124,245,196,.12);color:#7CF5C4;border-radius:999px;padding:3px 10px;font-size:12px}
.rk-list{display:grid}
.rk-row{border-radius:16px;transition:background .15s}.rk-row:hover,.rk-row.open{background:var(--cream)}
.rk-head{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:26px 32px minmax(140px,1.2fr) minmax(80px,2fr) 96px;gap:10px;align-items:center;padding:10px;cursor:pointer;border-radius:16px}
.rk-head:focus-visible{outline:3px solid var(--butter)}
.rk-rank{font-weight:800;color:var(--muted);text-align:center}
.rk-name{min-width:0}.rk-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-bar-wrap{display:grid;gap:6px;min-width:0}.rk-weeks{display:flex;flex-wrap:wrap;gap:4px}.rk-weeks span{font-size:11px;background:var(--cream);border-radius:999px;padding:1px 8px;color:var(--muted)}.rk-weeks b{color:var(--ink)}
.rk-bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}.rk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#F07A5E);border-radius:999px;transition:width .5s}
.rk-val{text-align:right;display:grid}.rk-val b{font-family:var(--display);font-size:17px}.rk-val span{font-size:11px}
.sotm{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.rk-sess{padding:0 14px 10px 56px}
@media (max-width:900px){.rk-head{grid-template-columns:22px 28px 1fr 78px;gap:8px}.rk-bar-wrap{grid-column:3 / 5;grid-row:2}.rk-sess{padding:0 8px 8px}}
.cd-check{margin-bottom:16px;border:2px solid var(--line)}
.cd-res{border-radius:16px;padding:12px 14px;display:grid;gap:4px;font-size:14px;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.cd-res.ok{background:#DDF3EC}.cd-res.warn{background:#FFF0C8}.cd-res.bad{background:#FBE0DF;border:2px solid var(--red)}
.cd-big{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.01em}
.cd-res.bad .cd-big{color:#9B1F25}.cd-res.ok .cd-big{color:#155E51}
.cd-hist{display:grid;gap:6px;margin-top:6px}.cd-hist>div{display:flex;gap:8px;align-items:center;font-size:13px}
.cd-ic{border:0;padding:0;width:52px;height:36px;border-radius:8px;overflow:hidden;cursor:zoom-in;flex:none}.cd-ic img{width:100%;height:100%;object-fit:cover}
.cd-sim{font-size:13px;margin-top:4px}
.newver{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:90;border:0;background:var(--red);color:#fff;font-weight:800;border-radius:999px;padding:10px 18px;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);cursor:pointer;animation:pop .4s}
.snk-wrap{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
.snk-phone{background:linear-gradient(160deg,#6E1A20,#3E1014);border-radius:38px 38px 60px 60px;padding:18px 18px 26px;box-shadow:0 20px 40px -18px rgba(43,21,24,.7),inset 0 2px 0 rgba(255,255,255,.12)}
.snk-top{display:flex;justify-content:space-between;align-items:center;color:#FBE9E3;font:700 13px var(--mono);letter-spacing:.14em;padding:2px 8px 10px}.snk-top b{color:var(--red)}
#snkScore{background:#0F4F44;color:#CFEFE3;border-radius:8px;padding:3px 10px;font-size:15px}
.snk-screen{position:relative;border-radius:16px;overflow:hidden;border:6px solid #2B1518;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15)}
#snk{display:block;width:100%;height:auto;aspect-ratio:1;touch-action:none;cursor:pointer;image-rendering:pixelated}
.snk-over{position:absolute;inset:0;display:grid;place-content:center;gap:6px;text-align:center;background:rgba(15,79,68,.72);color:#CFEFE3;font-family:var(--mono);padding:16px}
.snk-over b{font-family:var(--display);font-size:30px;color:#fff;letter-spacing:.04em}
.snk-keys{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,52px);gap:6px;justify-content:center;margin-top:18px}
.snk-keys button{border:0;border-radius:16px;background:#FBE9E3;color:var(--maroon);font-size:20px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);transition:transform .08s}
.snk-keys button:active{transform:translateY(3px);box-shadow:none}
#snkMid{background:var(--red);color:#fff;border-radius:50%}
@media (max-width:900px){.snk-wrap{grid-template-columns:1fr}.snk-phone{padding:14px 12px 20px}.snk-keys{grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,58px)}}
.linkbtn{border:0;background:none;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px}
.dropz{text-transform:none;letter-spacing:0;font-weight:500;cursor:pointer;display:grid;place-items:center;gap:6px;min-height:120px;transition:background .15s,border-color .15s}
.dropz.over,.dropz:hover{background:#FFF0C8;border-color:var(--butter)}
.dropz.has{border-style:solid}

.mobilebar,.scrim{display:none}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);margin:0;border-radius:0 28px 28px 0;z-index:70;transform:translateX(-105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:20px 0 40px -20px rgba(0,0,0,.5)}
  body.nav-open .rail{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(43,21,24,.45);z-index:65;opacity:0;pointer-events:none;transition:opacity .25s;display:block}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  .mobilebar{display:flex;position:fixed;left:10px;right:10px;bottom:10px;z-index:50;background:var(--maroon);border-radius:22px;padding:6px;gap:4px;box-shadow:0 12px 30px -10px rgba(43,21,24,.6);padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .mobilebar a,.mobilebar button{flex:1;display:grid;place-items:center;gap:1px;padding:7px 2px;border-radius:16px;color:#FBE9E3;text-decoration:none;border:0;background:none;font:inherit;cursor:pointer;position:relative;transition:background .15s,transform .15s}
  .mobilebar span{font-size:19px;line-height:1}
  .mobilebar b{font-size:10.5px;font-weight:700;letter-spacing:.02em}
  .mobilebar .on{background:var(--cream);color:var(--maroon)}
  .mobilebar a:active,.mobilebar button:active{transform:scale(.92)}
  .mobilebar .dot{position:absolute;top:6px;right:22%;width:9px;height:9px;border-radius:50%;background:var(--butter)}
  .main{padding:8px 12px 100px;height:auto;min-height:100%}
  .shell{height:auto;min-height:100%}
  .topbar{gap:8px;padding:4px 0 12px}
  .topbar .grow{flex-basis:100%}
  .topbar h3{font-size:19px!important}
  .ecg,.modeflag,#bugBtn,#outBtn{display:none}
  .rail .me{display:flex}
  .iconbtn{width:36px;height:36px;border-radius:12px;font-size:15px}
  .page-h{margin-bottom:12px}
  h2{font-size:22px}
  .card{padding:16px;border-radius:22px}
  .hero,.board,.prof,.g2,.g3,.login{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bim-grid{grid-template-columns:1fr!important}
  .hero-main{min-height:200px}
  .hero-main h1{font-size:26px}
  .chat{height:calc(100dvh - 290px)!important;min-height:360px}
  .msg{max-width:94%}
  .chat-in{padding:8px;gap:6px}
  .chat-in .stk button:nth-child(n+3){display:none}
  .chat-in .stk button{width:34px;height:34px}
  .chat-in input{min-width:0;flex:1}
  .chat-in .btn{padding:9px 14px}
  .ann{padding:12px;gap:10px}
  .ann-date{width:52px;height:56px}
  .ann-date b{font-size:22px}
  .tbl th,.tbl td{padding:8px}
  .modal{border-radius:24px;padding:18px}
  .copybox{flex-wrap:wrap}
  .row .btn{min-height:40px}
  .hero-main canvas{opacity:.35}
  .hero-main .txt{max-width:100%}
  .login-art{min-height:520px}
  .login-art .cap{left:24px;right:24px;bottom:24px;max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Semua waktu ikut Waktu Malaysia (MYT, UTC+8) */
const TZ='Asia/Kuala_Lumpur';
function myParts(d=new Date()){const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false,weekday:'short'}).formatToParts(d).map(x=>[x.type,x.value]));return {y:+p.year,m:+p.month,d:+p.day,h:(+p.hour)%24,mi:+p.minute,wd:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday)}}
const p2=n=>String(n).padStart(2,'0');
const myToday=()=>{const q=myParts();return `${q.y}-${p2(q.m)}-${p2(q.d)}`};
const myNowLocal=()=>{const q=myParts();return `${q.y}-${p2(q.m)}-${p2(q.d)}T${p2(q.h)}:${p2(q.mi)}`};
const hm12=(h,mi)=>`${h%12||12}:${p2(mi)} ${h<12?'AM':'PM'}`;
const fmtDT=t=>t?new Date(t).toLocaleString(LOC(),{timeZone:TZ,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'-';
const fmtD=s=>s?new Date(s+'T00:00:00').toLocaleDateString(LOC(),{day:'2-digit',month:'short',year:'numeric'}):'-';
function weekKey(d=new Date()){const q=myParts(d);const t=new Date(Date.UTC(q.y,q.m-1,q.d));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+String(Math.ceil(((t-y)/864e5+1)/7)).padStart(2,'0')}
function shiftWeek(k,n){const [y,w]=k.split('-W').map(Number);const d=new Date(Date.UTC(y,0,4+ (w-1)*7 + n*7));return weekKey(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('kkb:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'p:'+s}}

function trDom(root){if(!root||root.nodeType!==1)return;if(root.closest&&root.closest('[data-notr]'))return;
 const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement&&n.parentElement.closest('[data-notr],script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;
 while((n=w.nextNode())){const t=n.nodeValue;if(t&&DICT[t.trim()])n.nodeValue=tx(t)}
 root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(e=>{if(e.closest('[data-notr]'))return;for(const a of ['placeholder','title','aria-label']){const v=e.getAttribute(a);if(v&&DICT[v.trim()])e.setAttribute(a,tx(v))}})}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)trDom(n);else if(n.nodeType===3&&n.parentElement&&!n.parentElement.closest('[data-notr]')&&DICT[n.nodeValue.trim()])n.nodeValue=tx(n.nodeValue)}}).observe(document.body,{childList:true,subtree:true});

const scenes=[];
function make3D(canvas,opts={}){
 if(!window.THREE||!canvas)return;
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const r=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));
 const sc=new THREE.Scene();const cam=new THREE.PerspectiveCamera(40,1,.1,100);cam.position.set(0,0,opts.z||9);
 sc.add(new THREE.AmbientLight(0xffffff,.42));sc.add(new THREE.HemisphereLight(0xfff4e8,0x5e1a20,.35));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,5,6);sc.add(dl);const pl=new THREE.PointLight(0xffd372,.7);pl.position.set(-4,-2,4);sc.add(pl);
 const grp=new THREE.Group();sc.add(grp);
 const red=new THREE.MeshStandardMaterial({color:0xc4141f,roughness:.28,metalness:.12});
 const white=new THREE.MeshStandardMaterial({color:0xfff4e8,roughness:.5});
 const cross=new THREE.Group();
 const a=new THREE.Mesh(new THREE.BoxGeometry(1,3,1),red),b=new THREE.Mesh(new THREE.BoxGeometry(3,1,1),red);cross.add(a,b);
 const plate=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,.5,48),white);plate.rotation.x=Math.PI/2;plate.position.z=-.6;cross.add(plate);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(2.35,.12,16,64),new THREE.MeshStandardMaterial({color:0x5e1a20,roughness:.4}));ring.position.z=-.35;cross.add(ring);
 cross.scale.setScalar(opts.scale||1);grp.add(cross);
 const pills=[];const cols=[[0xd3343a,0xfff4e8],[0x9ed9c8,0xffffff],[0xffd372,0xd3343a],[0x23806f,0xfff4e8]];
 for(let i=0;i<(opts.pills??7);i++){
  const p=new THREE.Group();const [c1,c2]=cols[i%cols.length];const m1=new THREE.MeshStandardMaterial({color:c1,roughness:.3}),m2=new THREE.MeshStandardMaterial({color:c2,roughness:.3});
  const h=.45,rad=.22;const c1m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,20),m1);c1m.position.y=h/2;const c2m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,h,20),m2);c2m.position.y=-h/2;
  const s1=new THREE.Mesh(new THREE.SphereGeometry(rad,20,14),m1);s1.position.y=h;const s2=new THREE.Mesh(new THREE.SphereGeometry(rad,20,14),m2);s2.position.y=-h;p.add(c1m,c2m,s1,s2);
  const ang=i/(opts.pills??7)*Math.PI*2;p.userData={ang,rad:3.2+Math.random()*.8,y:(Math.random()-.5)*2.6,spin:.5+Math.random(),off:Math.random()*6};
  p.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);grp.add(p);pills.push(p);
 }
 let mx=0,my=0;const host=canvas.parentElement;
 host.addEventListener('pointermove',e=>{const b=host.getBoundingClientRect();mx=((e.clientX-b.left)/b.width-.5)*2;my=((e.clientY-b.top)/b.height-.5)*2});
 host.addEventListener('click',()=>{cross.userData.boost=1;Snd.play('beat')});
 const st={alive:true};scenes.push(st);
 let lw=0,lh=0;function size(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h||(w===lw&&h===lh))return;lw=w;lh=h;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
  const visH=2*Math.tan(cam.fov*Math.PI/360)*cam.position.z,visW=visH*cam.aspect;const wide=w>=640;const sx=wide?(opts.shiftX||0):(opts.mShiftX||0),sy=wide?(opts.shiftY||0):(opts.mShiftY||0);
  grp.position.set(visW*sx,visH*sy,0);const fit=Math.min(1,(visW*(wide?(.5-Math.abs(sx)):.5))/4.6,(visH*(.5-Math.abs(sy)))/2.8);grp.scale.setScalar(Math.max(.45,fit))}
 size();addEventListener('resize',size);
 const t0=performance.now();
 (function loop(){if(!st.alive||!canvas.isConnected){st.alive=false;r.dispose();return}
  const t=(performance.now()-t0)/1000;size();
  const beat=1+Math.max(0,Math.sin(t*5.2))**8*.06+(cross.userData.boost||0)*.25;cross.userData.boost=Math.max(0,(cross.userData.boost||0)-.03);
  cross.scale.setScalar((opts.scale||1)*beat);
  if(!reduce){cross.rotation.y+=((mx*.6+Math.sin(t*.6)*.25)-cross.rotation.y)*.05;cross.rotation.x+=((my*.4)-cross.rotation.x)*.05;
   pills.forEach(p=>{const u=p.userData;const a2=u.ang+t*.25;p.position.set(Math.cos(a2)*u.rad,u.y+Math.sin(t*u.spin+u.off)*.3,Math.sin(a2)*u.rad*.5);p.rotation.x+=.01*u.spin;p.rotation.z+=.008})}
  else pills.forEach(p=>{const u=p.userData;p.position.set(Math.cos(u.ang)*u.rad,u.y,Math.sin(u.ang)*u.rad*.5)});
  r.render(sc,cam);requestAnimationFrame(loop)})();
}

function toast(msg,type=''){const d=document.createElement('div');d.className='toast '+type;d.textContent=tx(msg);$('#toasts').append(d);setTimeout(()=>d.remove(),3600)}
function av(s,cls=''){if(!s)return `<span class="av ${cls}" style="background:#C9B6AD">?</span>`;const ini=esc((s.name||'?').replace(/^(DR\.?|MADAM|NURSE|INTERN|SD|PUAN)\s*/i,'').slice(0,1)||'?');
 return `<span class="av ${cls}" style="background:${esc(s.color||'#D3343A')}">${s.avatar?`<img alt="" src="${esc(s.avatar)}">`:ini}</span>`}
function roleChip(r,short){const c=r==='BA BL'?'maroon':isLead(r)?'red':isOver(r)?'maroon':(r==='HEAD DOCTOR'||r==='SENIOR DOCTOR')?'mint':'butter';return `<span class="chip ${c}">${esc(short?SHORT[r]:r)}</span>`}
function stars(val,key,ro){let h=`<span class="stars ${ro?'ro':''}" ${key?`data-stars="${esc(key)}"`:''}>`;for(let i=1;i<=5;i++)h+=`<button type="button" class="${i<=(val||0)?'on':''}" data-v="${i}" aria-label="${i} bintang" ${ro?'tabindex="-1"':''}>★</button>`;return h+'</span>'}
function modal(html,onMount){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;document.body.append(bg);
 const close=()=>bg.remove();bg.addEventListener('click',e=>{if(e.target===bg||e.target.closest('[data-close]'))close()});onMount&&onMount(bg.firstElementChild,close);return close}
async function copy(text,label='Disalin'){try{await navigator.clipboard.writeText(text);toast(tx(label)+' ✓','ok');Snd.play('pop')}catch(e){modal(`<h3>Salin manual</h3><p class="muted" style="margin:6px 0 10px">Browser ini menyekat salin automatik. Pilih teks di bawah dan tekan Ctrl+C.</p><textarea readonly style="min-height:120px">${esc(text)}</textarea><div class="row" style="margin-top:12px"><button class="btn" data-close>Tutup</button></div>`,m=>$('textarea',m).select())}}
function resizeImg(file,max=160){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const side=Math.min(img.width,img.height);const c=document.createElement('canvas');c.width=c.height=max;c.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,max,max);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function periodRange(mode,key){if(mode==='bulan'){const [y,m]=key.split('-').map(Number);const a=Date.UTC(y,m-1,1)-8*36e5,b=Date.UTC(y,m,1)-8*36e5;return [a,b,`${MON_L[m-1]} ${y}`]}
 const [y,w]=key.split('-W').map(Number);const d=new Date(Date.UTC(y,0,4));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()-day+1+(w-1)*7);const a=d.getTime()-8*36e5;const e=new Date(a+8*36e5+6*864e5);return [a,a+7*864e5,`${d.getUTCDate()} ${MON[d.getUTCMonth()]} – ${e.getUTCDate()} ${MON[e.getUTCMonth()]} ${e.getUTCFullYear()}`]}
const monthKey=()=>{const q=myParts();return `${q.y}-${p2(q.m)}`};
const shiftMonth=(k,n)=>{let [y,m]=k.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return `${y}-${p2(m)}`};

 const WK=[];if(mode==='bulan'){let s=A;while(s<B){const d=new Date(s+8*36e5);const dow=d.getUTCDay()||7;const nxt=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()+(8-dow))-8*36e5;WK.push([s,Math.min(nxt,B)]);s=nxt}}
 const wkLbl=([ws,we])=>{const a=new Date(ws+8*36e5),b=new Date(we-1+8*36e5);return `${a.getUTCDate()}–${b.getUTCDate()}`};
 for(const s of S.staff.filter(x=>x.active!==false))rows[s.id]={s,mins:0,n:0,last:0,sess:[],over:0};
 for(const x of allSessions()){const a=Math.max(x.start,A),b=Math.min(x.end,B);if(b<=a)continue;let mins=(b-a)/6e4;const full=(x.end-x.start)/6e4;const over=full>SHIFT_CAP;
  const key2=x.staffId&&staffById(x.staffId)?x.staffId:'raw:'+x.norm;rows[key2]=rows[key2]||{s:staffById(x.staffId)||{name:x.name,role:'',raw:true},mins:0,n:0,last:0,sess:[],over:0};
  const r=rows[key2];if(mode==='bulan'){r.weeks=r.weeks||WK.map(()=>0);WK.forEach(([ws,we],wi)=>{const o=Math.min(b,we)-Math.max(a,ws);if(o>0)r.weeks[wi]+=o/6e4})}r.mins+=mins;r.n++;r.last=Math.max(r.last,x.end);r.sess.push({...x,mins,over,a});if(over)r.over++;if(x.live&&now()<B){r.liveSince=(r.liveSince||[]).concat(a)}else{r.baseMs=(r.baseMs||0)+mins*6e4}}
 const list=Object.entries(rows).map(([id,r])=>({id,...r})).sort((a,b)=>b.mins-a.mins||(RANK[b.s.role]||0)-(RANK[a.s.role]||0));
 const max=Math.max(60,...list.map(r=>r.mins));const total=list.reduce((t,r)=>t+r.mins,0);const worked=list.filter(r=>r.mins>0).length;const liveN=Object.keys(S.duty.map||{}).length;const allLive=list.flatMap(r=>r.liveSince||[]);const baseTotal=list.reduce((t,r)=>t+(r.baseMs||0),0);
 el.innerHTML=`<div class="page-h"><div class="grow"><h2>${L('Rekap Jam Kerja','Rekap Jam Kerja')}</h2><p class="muted">${L('Dikira automatik daripada bilik kawalan: mula bila nama diisi, tamat bila nama dikosongkan. Semua jam dikira penuh tanpa had. Sesi lebih 12 jam ditanda ⚠ supaya mudah disemak (mungkin lupa kosongkan).','Dihitung otomatis dari ruang kendali: mulai saat nama diisi, selesai saat nama dikosongkan. Semua jam dihitung penuh tanpa batas. Sesi lebih dari 12 jam ditandai ⚠ supaya mudah dicek (mungkin lupa dikosongkan).')}</p></div>

function dataURLtoBlob(d){const [hd,b]=d.split(',');const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:(hd.match(/:(.*?);/)||[])[1]||'image/jpeg'})}
async function sendDiscord(key,content,file,silent,urlOverride){const url=urlOverride||(S.webhooks||{})[key];if(!url)return false;
 const payload={content:String(content).slice(0,1990),username:((S.me?.name||'KKB')+' · KKB-HUB').slice(0,80),allowed_mentions:{parse:['everyone','roles']}};
 try{let opt;if(file){const fd=new FormData();fd.append('payload_json',JSON.stringify(payload));fd.append('files[0]',file,'ic.jpg');opt={method:'POST',body:fd}}else opt={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)};
  const r=await fetch(url+'?wait=true',opt);if(!r.ok)throw new Error('HTTP '+r.status);if(!silent)toast(L('Dihantar ke Discord ✓','Terkirim ke Discord ✓'),'ok');let j=null;try{j=await r.json()}catch(e){}return (j&&j.id)||true}
 catch(e){toast(L('Gagal hantar ke Discord: ','Gagal kirim ke Discord: ')+(e.message||e),'err');return false}}

const normName=s=>{let x=String(s||'').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();let prev;do{prev=x;x=x.replace(/^(DR|DOKTOR|DOCTOR|NURSE|NRS|SD|HD|HDS|INTERN|MADAM|MISS|PUAN|SIR|TUAN|MR|MS|ENCIK|CIK)\s+/,'')}while(x!==prev);return x};
function matchStaff(n){if(!n)return null;return S.staff.find(s=>normName(s.name)===n||normName(s.username)===n)||null}
function dutyMap(d){const m={};const add=r=>{const n=normName(r);if(n&&!m[n])m[n]=String(r).trim()};add(d.kawalan);(d.pairs||[]).forEach(p=>{add(p.a);add(p.b)});(d.backup||[]).forEach(add);['register','diagnosis','treatment','pharmacy'].forEach(k=>add(d[k]));return m}
const shiftId=(n,start)=>(n+'_'+start).replace(/[^A-Za-z0-9_-]/g,'-');
/* Jam duty disimpan dalam dokumen berasingan (kawalan/duty) dan diselaraskan oleh setiap pelayar versi baru.
   Jadi walaupun ada staff guna versi lama yang menimpa kawalan/current, jam tetap dikira. Rekod sesi guna ID tetap supaya tiada pendua. */
let reconciling=false;
async function reconcileDuty(k){if(!S.duty.loaded||!k||reconciling)return;const t=k.at||now();if(t<(S.duty.at||0))return;
 let prev=S.duty.map||{};if(!Object.keys(prev).length&&!S.duty.at&&k.onDuty)prev=k.onDuty;
 const cur=dutyMap(k);const next={};let changed=false;
 for(const n in cur){if(prev[n])next[n]=prev[n];else{next[n]={raw:cur[n],start:t,staffId:matchStaff(n)?.id||''};changed=true}}
 const ended=Object.keys(prev).filter(n=>!cur[n]);if(ended.length)changed=true;
 if(!changed&&S.duty.at)return;
 reconciling=true;try{
  for(const n of ended){const p=prev[n];if(t<=p.start)continue;await Store.set('shifts/'+shiftId(n,p.start),{name:p.raw,norm:n,staffId:p.staffId||matchStaff(n)?.id||'',start:p.start,end:t,mins:Math.round((t-p.start)/6e4),by:S.me?.id||''})}
  S.duty={map:next,at:t,loaded:true};await Store.set('kawalan/duty',{map:next,at:t});
 }catch(e){console.warn('duty',e)}finally{reconciling=false}}
function applyDuty(d){const prev=S.duty.map||{};const cur=dutyMap(d);return {started:Object.keys(cur).filter(n=>!prev[n]).length,ended:Object.keys(prev).filter(n=>!cur[n]).length}}

function pukatFree(cat,item,qty){
 if(item==='medkit')return Math.floor(Math.min(qty,50)/10);

/* ---------- Cooldown pembeli (semak nama) ---------- */
const nkey=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;let prev=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
function nameSimilar(a,b){const x=nkey(a),y=nkey(b);if(!x||!y||x===y)return false;if(Math.min(x.length,y.length)>=4&&(x.includes(y)||y.includes(x)))return true;return lev(x,y)<=(Math.max(x.length,y.length)>=8?2:1)}
const CD_GROUP=c=>c==='rakyat'?'rakyat':'ht';
const CD_RULE={rakyat:{limit:100,ms:48*36e5,lbl:['Rakyat biasa · 100 bandage / 2 hari','Warga biasa · 100 bandage / 2 hari']},ht:{limit:500,ms:7*864e5,lbl:['HT / Polis · 500 bandage / 7 hari','HT / Polisi · 500 bandage / 7 hari']}};
function cooldownFor(name,cat,exceptId){const g=CD_GROUP(cat),r=CD_RULE[g],t=now();const k=nkey(name);
 const inWin=S.pukat.filter(p=>p.id!==exceptId&&p.item==='bandage'&&CD_GROUP(p.cat)===g&&t-p.at<r.ms&&p.at<=t);
 const recs=inWin.filter(p=>nkey(p.buyer)===k).sort((a,b)=>a.at-b.at);const used=recs.reduce((s,p)=>s+(+p.qty||0),0);
 let until=0;if(used>=r.limit){let rem=used;for(const p of recs){rem-=p.qty;if(rem<r.limit){until=p.at+r.ms;break}}}
 const sim=k?inWin.filter(p=>nameSimilar(p.buyer,name)):[];
 return {g,rule:r,used,left:Math.max(0,r.limit-used),until,recs,sim,blocked:used>=r.limit}}
function activeCooldowns(){const t=now();const seen={};const out=[];
 for(const p of [...S.pukat].sort((a,b)=>b.at-a.at)){if(p.item!=='bandage')continue;const g=CD_GROUP(p.cat);const key=g+'|'+nkey(p.buyer);if(seen[key]||t-p.at>=CD_RULE[g].ms)continue;seen[key]=1;
  const c=cooldownFor(p.buyer,p.cat);if(c.blocked)out.push({name:p.buyer,cat:p.cat,...c})}
 return out.sort((a,b)=>a.until-b.until)}
const untilTxt=u=>{const m=Math.max(0,(u-now())/6e4);return `${fmtDT(u)} (${L('lagi','lagi')} ${fmtH(m)})`};
function cdVerdict(name,cat,qty){if(!nkey(name))return '';const c=cooldownFor(name,cat);const lbl=L(...c.rule.lbl);
 const last=c.recs.length?c.recs[c.recs.length-1]:null;
 const hist=c.recs.length?`<div class="cd-hist">${c.recs.map(p=>`<div>${p.ic?`<button type="button" class="cd-ic" data-ic="${esc(p.id)}"><img src="${esc(p.ic)}" alt=""></button>`:'🪪'}<span><b>${p.qty} bandage</b> · ${fmtDT(p.at)} · take over ${esc(p.takeOver||'-')}</span></div>`).join('')}</div>`:'';
 const simTxt=c.sim.length?`<div class="cd-sim">⚠ ${L('Nama hampir sama dalam tempoh cooldown:','Nama mirip dalam masa cooldown:')} ${[...new Set(c.sim.map(p=>p.buyer))].map(n=>`<button type="button" class="linkbtn" data-cdpick="${esc(n)}">${esc(n)}</button>`).join(', ')}. ${L('Pastikan bukan orang yang sama.','Pastikan bukan orang yang sama.')}</div>`:'';
 if(c.blocked)return `<div class="cd-res bad"><div class="cd-big">⛔ ${L('TOLAK · DALAM COOLDOWN','TOLAK · MASIH COOLDOWN')}</div><div>${esc(name.toUpperCase())} ${L('sudah beli','sudah beli')} <b>${c.used} bandage</b> (${esc(lbl)}).</div><div>${L('Boleh beli semula','Boleh beli lagi')}: <b>${untilTxt(c.until)}</b></div>${hist}${simTxt}</div>`;
 const want=qty||0;const over=want>c.left;
 return `<div class="cd-res ${over?'warn':'ok'}"><div class="cd-big">${over?'⚠ '+L('MELEBIHI BAKI','MELEBIHI SISA KUOTA'):'✅ '+L('BOLEH BELI','BOLEH BELI')}</div><div>${c.used?`${L('Sudah beli','Sudah beli')} <b>${c.used}</b> ${L('dalam tempoh ini','dalam periode ini')}. `:L('Tiada pembelian dalam tempoh cooldown. ','Tidak ada pembelian dalam masa cooldown. ')}${L('Baki boleh beli','Sisa kuota')}: <b>${c.left} bandage</b> <span class="muted">(${esc(lbl)})</span></div>${over?`<div>${L('Kuantiti diminta','Jumlah diminta')} ${want} > ${L('baki','sisa')} ${c.left}.</div>`:''}${hist}${simTxt}</div>`}

async function imgFromClipboardEvent(e){const cd=e.clipboardData;if(!cd)return null;

 return 'none'}

async function pasteFromClipboardApi(){if(!pasteHandler)return;
 if(!navigator.clipboard||!navigator.clipboard.read){toast(L('Browser ini tidak sokong butang Tampal. Klik kotak gambar lalu tekan Ctrl+V.','Browser ini tidak mendukung tombol Tempel. Klik kotak gambar lalu tekan Ctrl+V.'),'err');return}
 try{const items=await navigator.clipboard.read();for(const it of items){const t=it.types.find(x=>x.startsWith('image/'));if(t){pasteHandler(await it.getType(t));return}}
  toast(L('Clipboard tiada gambar. Salin gambar dulu (Win+Shift+S atau klik kanan → Salin gambar).','Clipboard tidak berisi gambar. Salin gambar dulu (Win+Shift+S atau klik kanan → Salin gambar).'),'err')}
 catch(err){toast(L('Akses clipboard ditolak. Benarkan izin clipboard di browser, atau klik kotak gambar lalu tekan Ctrl+V.','Akses clipboard ditolak. Izinkan clipboard di browser, atau klik kotak gambar lalu tekan Ctrl+V.'),'err')}}

R.akkb=el=>{
 el.innerHTML=`<div class="page-h"><div class="grow"><h2>Command /akkb</h2><p class="muted">Pengumuman KKB untuk chat server FiveM. Isi ruang kosong, tekan Salin, lalu tampal dalam chat game.</p></div></div>
 <div class="grid g2" style="align-items:start"><div class="stack">${AKKB.map((g,gi)=>`<div class="card"><div class="card-h"><h3 class="grow">${esc(g.g)}</h3><span class="chip red">${g.items.length}</span></div><div class="list">${g.items.map((it,ii)=>`<div class="li" style="display:grid;gap:8px"><div style="font-size:13px;font-weight:500">${esc(it.t)}</div>
 ${(it.f||[]).length?`<div class="row">${it.f.map(f=>`<input type="text" style="width:150px;padding:6px 10px" placeholder="${f}" value="${esc((it.d||{})[f]||'')}" data-f="${gi}-${ii}-${f}" aria-label="${f}">`).join('')}</div>`:''}
 <div class="row"><button class="btn sm red" data-ak="${gi}-${ii}">Salin /akkb</button><button class="btn sm ghost" data-bind="${gi}-${ii}">Salin bind</button></div></div>`).join('')}</div></div>`).join('')}</div>
 <div class="stack" style="position:sticky;top:10px"><div class="card maroon"><h3>Cara guna dalam FiveM</h3><ol class="ol" style="margin-top:12px"><li><span>Tekan <b>Salin /akkb</b> pada pengumuman yang kamu mahu.</span></li><li><span>Dalam game, tekan <b>T</b> untuk buka chat.</span></li><li><span>Tekan <b>Ctrl + V</b> untuk tampal, lalu <b>Enter</b>.</span></li></ol></div>
 <div class="card butter"><h3>Buat shortcut (bind)</h3><p style="margin:8px 0">Supaya satu butang terus hantar pengumuman tanpa taip:</p><ol class="ol"><li><span>Tekan <b>Salin bind</b> pada pengumuman.</span></li><li><span>Dalam game tekan <b>F8</b> untuk buka console.</span></li><li><span>Tampal (Ctrl+V), tukar butang kalau mahu (cth F6), tekan Enter.</span></li><li><span>Uji butang tu sekali. Kalau tiada apa berlaku, server mungkin tak benarkan bind untuk /akkb, guna cara salin-tampal biasa.</span></li></ol>
 <div class="copybox" style="margin-top:10px"><code>unbind keyboard F6</code><button class="btn sm" data-cp="unbind keyboard F6">Salin</button></div><p class="muted" style="font-size:12px;margin-top:6px">Guna arahan di atas untuk buang bind.</p></div>
 <div class="card"><h3>Bind wajib KKB</h3><div class="stack" style="margin-top:10px">${['bind keyboard 6 "e clipboard"','bind keyboard 7 "revivep"','bind keyboard 8 "escort"'].map(c=>`<div class="copybox"><code>${esc(c)}</code><button class="btn sm" data-cp="${esc(c)}">Salin</button></div>`).join('')}</div></div></div></div>`;
 const text=key=>{const [gi,ii]=key.split('-').map(Number);const it=AKKB[gi].items[ii];let t=it.t;(it.f||[]).forEach(f=>{const v=($(`[data-f="${gi}-${ii}-${f}"]`)?.value||'').trim().toUpperCase();t=t.replace('{'+f+'}',v||'...')});return t};
 $$('[data-ak]').forEach(b=>b.onclick=()=>copy('/akkb '+text(b.dataset.ak),'/akkb disalin'));
 $$('[data-bind]').forEach(b=>b.onclick=()=>copy(`bind keyboard F6 "akkb ${text(b.dataset.bind).replace(/"/g,"'")}"`,'Arahan bind disalin'));
 $$('[data-cp]').forEach(b=>b.onclick=()=>copy(b.dataset.cp));
};

const stL=st=>({pending:L('menunggu','menunggu'),diluluskan:L('diluluskan','disetujui'),ditolak:L('ditolak','ditolak')}[st]||st);
function requestCard(c,kind,reviewer){
 const s=staffById(c.staffId);const st=c.status||'pending';const cls=st==='diluluskan'?'mint':st==='ditolak'?'red':'butter';
 return `<div class="li" style="align-items:flex-start">${av(s,'sm')}<div class="grow"><div class="row"><b>${esc(nameOf(c.staffId))}</b>${s?roleChip(s.role,true):''}<span class="chip ${cls}">${esc(stL(st))}</span></div>
 <div style="font-size:13px;margin-top:4px">${kind==='cuti'?`📅 ${fmtD(c.from)} → ${fmtD(c.to)}`:`📅 ${L('Efektif','Berlaku')} ${fmtD(c.date)}`}</div><div class="muted" style="font-size:13px">${L('Sebab','Alasan')}: ${esc(c.reason)}</div>
 ${c.reviewedBy?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(stL(st))} ${L('oleh','oleh')} ${esc(nameOf(c.reviewedBy))}${c.note?` · "${esc(c.note)}"`:''}</div>`:''}
 ${(()=>{const mgr=kind==='cuti'?can('permohonan'):isBABL();const own=c.staffId===S.me.id&&st==='pending';const btns=[];
  if(reviewer&&st==='pending')btns.push(`<button class="btn sm mint" data-ok="${kind}:${esc(c.id)}">Luluskan</button><button class="btn sm red" data-no="${kind}:${esc(c.id)}">Tolak</button>`);
  if(mgr&&st!=='pending')btns.push(`<button class="btn sm ghost" data-rreset="${kind}:${esc(c.id)}">↺ ${L('Set semula','Batalkan keputusan')}</button>`);
  if(mgr||own)btns.push(`<button class="btn sm ghost" data-rdel="${kind}:${esc(c.id)}">🗑 ${own&&!mgr?L('Batal permohonan','Batalkan permohonan'):L('Padam','Hapus')}</button>`);
  return btns.length?`<div class="row" style="margin-top:8px">${btns.join('')}</div>`:''})()}</div><span class="muted" style="font-size:11px">${fmtDT(c.at)}</span></div>`}
function bindReview(el){
 $$('[data-rdel]',el).forEach(b=>b.onclick=()=>{const [kind,id]=b.dataset.rdel.split(':');delRecord({col:kind,id,whKey:kind,title:kind==='cuti'?L('Padam permohonan cuti ini?','Hapus permohonan cuti ini?'):L('Padam permohonan resign ini?','Hapus permohonan resign ini?'),desc:L('Gunakan ini jika permohonan tersalah isi atau tersalah lulus. Rekod akan hilang sepenuhnya.','Pakai ini kalau permohonan salah isi atau salah disetujui. Catatan akan hilang sepenuhnya.')})});
 $$('[data-rreset]',el).forEach(b=>b.onclick=()=>{const [kind,id]=b.dataset.rreset.split(':');const c=S[kind].find(x=>x.id===id);if(!c)return;
  modal(`<h3>${L('Set semula keputusan?','Batalkan keputusan?')}</h3><p class="muted" style="margin:8px 0 14px">${L('Status akan kembali ke "menunggu" supaya boleh diluluskan atau ditolak semula.','Status kembali ke "menunggu" supaya bisa disetujui atau ditolak ulang.')}</p><div class="row"><button class="btn red" id="yes">${L('Set semula','Batalkan keputusan')}</button><button class="btn ghost" data-close>${L('Batal','Batal')}</button></div>`,(m,close)=>{$('#yes',m).onclick=async()=>{
   if(await safe(Store.update(kind+'/'+id,{status:'pending',reviewedBy:'',note:'',reviewedAt:0,decisionMsg:''}),L('Keputusan dibatalkan','Keputusan dibatalkan'))){logAct('set semula '+kind,nameOf(c.staffId));if(c.decisionMsg)delDiscord(kind,c.decisionMsg)}close()}})});
 const act=(v,st)=>{const [kind,id]=v.split(':');modal(`<h3>${st==='diluluskan'?'Luluskan':'Tolak'} permohonan</h3><form class="stack" style="margin-top:12px"><div class="field"><label for="rn">Catatan (pilihan)</label><textarea id="rn"></textarea></div><div class="row"><button class="btn ${st==='diluluskan'?'mint':'red'}">Sahkan</button><button type="button" class="btn ghost" data-close>Batal</button></div></form>`,(m,close)=>{$('form',m).onsubmit=async e=>{e.preventDefault();const c=S[kind].find(x=>x.id===id);if(await safe(Store.update(kind+'/'+id,{status:st,reviewedBy:S.me.id,note:$('#rn',m).value.trim(),reviewedAt:now()}),L('Permohonan ','Permohonan ')+stL(st))){logAct(st+' '+kind,nameOf(c?.staffId));const nt=$('#rn',m).value.trim();trackSend(kind,id,'decisionMsg',sendDiscord(kind,`${st==='diluluskan'?'✅':'❌'} ${kind==='cuti'?'Cuti':'Resign'} **${nameOf(c?.staffId)}**${kind==='cuti'&&c?` (${dm(c.from)}${c.to!==c.from?' - '+dm(c.to):''})`:''} ${st.toUpperCase()} oleh ${S.me.name}${nt?`\nCatatan: ${nt}`:''}`))}close()}})};
 $$('[data-ok]',el).forEach(b=>b.onclick=()=>act(b.dataset.ok,'diluluskan'));$$('[data-no]',el).forEach(b=>b.onclick=()=>act(b.dataset.no,'ditolak'))}

 el.innerHTML=`<div class="page-h"><div class="grow"><h2>Apply Cuti ${whChip('cuti')}</h2><p class="muted">Permohonan dihantar kepada KP, TP, BA BL dan Penasihat untuk diluluskan.</p></div></div>

 el.innerHTML=`<div class="page-h"><div class="grow"><h2>Borang Resign ${whChip('resign')}</h2><p class="muted">Sedih tengok kamu pergi 🥲 Borang ini dihantar kepada BA BL yang mengurus resign.</p></div></div>

R.profil=el=>{
 const id=S.ui.profil&&staffById(S.ui.profil)?S.ui.profil:S.me.id;const s=staffById(id);const mine=id===S.me.id;
 const cutiN=S.cuti.filter(c=>c.staffId===id&&c.status==='diluluskan').length;const kawN=S.kawalanLog.filter(k=>k.by===id).length;
 const ev=Object.values(S.evals).map(e=>(e.rows||{})[id]).filter(Boolean);const sts=ev.flatMap(r=>[r.kpStar,r.tpStar]).filter(Boolean);const avg=sts.length?(sts.reduce((a,b)=>a+b,0)/sts.length).toFixed(1):'-';
 const chatN=S.chat.filter(m=>m.by===id).length;
 const showEval=mine||can('evaluasi');
 el.innerHTML=`<div class="page-h"><div class="grow"><h2>${mine?'Profil Saya':'Profil Staff'}</h2></div><select id="pickP" aria-label="Lihat profil staff" style="width:auto">${S.staff.filter(x=>x.active!==false).map(x=>`<option value="${esc(x.id)}" ${x.id===id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
 <div class="prof"><div class="stack"><div class="card" style="background:${esc(s.color||'#D3343A')};color:#fff"><div class="prof-head">${av(s,'lg')}<div class="grow"><div style="font-size:13px;opacity:.8">@${esc(s.username)}</div><h1 style="color:#fff">${esc(s.name)}</h1><div class="row" style="margin-top:8px">${roleChip(s.role)}${s.dev?'<span class="chip maroon">DEV</span>':''}${cdChip(s)}${(s.unit||[]).map(u=>`<span class="chip">🚁 ${esc(u)}</span>`).join('')}</div></div></div></div>
 <div class="quote" data-notr>${esc(s.bio||L('Belum tulis status. ✍️','Belum menulis status. ✍️'))}</div>
 <div class="grid g4">${[['Cuti lulus',cutiN],['Kawalan',kawN],['Mesej',chatN],[showEval?'Purata ★':'Sertai',showEval?avg:new Date(s.joined||now()).toLocaleDateString(LOC(),{month:'short',year:'2-digit'})]].map(([l,v],i)=>`<div class="card ${['red','maroon','mint','butter'][i]} tilt" style="padding:14px"><div style="font-family:var(--display);font-size:30px;font-weight:800" class="num">${v}</div><div style="font-size:12px">${l}</div></div>`).join('')}</div>
 <div class="card"><div class="row"><span class="muted" style="font-size:12px;font-weight:700;letter-spacing:.06em">EMOJI FAVORIT</span><div class="emo-row">${(s.emojis||[]).map(e=>`<span>${esc(e)}</span>`).join('')}</div></div></div></div>

 <div class="field"><label for="pp">PIN log masuk (pilihan, 4-6 digit)</label><input type="password" id="pp" inputmode="numeric" maxlength="6" placeholder="${s.pinHash?'PIN sudah diset. Isi untuk tukar':'Kosongkan kalau tak mahu PIN'}">${s.pinHash?'<button type="button" class="btn sm ghost" id="rmPin" style="width:max-content">Buang PIN</button>':''}</div>

 <div class="card"><h3>Status data</h3><div class="list" style="margin-top:10px;font-size:13px"><div>Mod: <b>${Store.mode==='firebase'?'Dikongsi (Firebase)':Store.mode==='remote'?'Dikongsi (claude db)':'Demo (browser ini)'}</b></div><div>Staff: <b>${S.staff.length}</b> · Mesej: <b>${S.chat.length}</b> · Log: <b>${S.log.length}</b></div></div></div>
 <div class="card butter"><h3>Alat</h3><div class="row" style="margin-top:10px"><button class="btn sm" id="exp">Salin semua data (JSON)</button><button class="btn sm ghost" id="clrChat">Kosongkan chat</button><button class="btn sm ghost" id="clrLog">Kosongkan log</button>${Store.mode==='local'?'<button class="btn sm red" id="rstDemo">Reset demo</button>':''}</div></div></div>
 <form class="card" id="whf" style="margin-bottom:16px"><div class="card-h"><h3 class="grow">Webhook Discord</h3><span class="chip ${WH_KEYS.every(([k])=>whOn(k))?'mint':'butter'}">${WH_KEYS.filter(([k])=>whOn(k)).length}/5 ${L('aktif','aktif')}</span></div>
 <p class="muted" style="margin-bottom:12px">${L('Tampal URL webhook setiap channel. Form di web akan dihantar automatik ke channel itu. Jangan kongsi URL ini dengan sesiapa.','Tempel URL webhook tiap channel. Form di web akan otomatis terkirim ke channel itu. Jangan bagikan URL ini ke siapa pun.')}</p>
 <div class="stack">${WH_KEYS.map(([k,ch])=>`<div class="row" style="flex-wrap:nowrap"><span class="chip ${whOn(k)?'mint':''}" style="min-width:150px">${ch}</span><input type="password" data-wh="${k}" value="${esc((S.webhooks||{})[k]||'')}" placeholder="https://discord.com/api/webhooks/..." autocomplete="off" style="flex:1"><button type="button" class="btn sm ghost" data-whshow="${k}" aria-label="Tunjuk">👁</button><button type="button" class="btn sm" data-whtest="${k}">${L('Uji','Tes')}</button></div>`).join('')}</div>
 <div class="sep"></div><h4 style="margin-bottom:6px">${L('ID role untuk tag di surat resign (pilihan)','ID role untuk tag di surat resign (opsional)')}</h4>
 <p class="muted" style="font-size:13px;margin-bottom:10px">${L('Discord: Tetapan Pengguna → Advanced → hidupkan Developer Mode. Kemudian Server Settings → Roles → klik kanan role → Copy Role ID.','Discord: User Settings → Advanced → nyalakan Developer Mode. Lalu Server Settings → Roles → klik kanan role → Copy Role ID.')}</p>
 <div class="grid g3">${[['babl','@BA KYRAA'],['kp','@KETUA PENGARAH'],['tp','@TIMBALAN PENGARAH']].map(([k,l])=>`<div class="field"><label for="ri_${k}">${l}</label><input type="text" id="ri_${k}" inputmode="numeric" value="${esc((S.webhooks||{})['role_'+k]||'')}" placeholder="cth: 1571050000000000000"></div>`).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="btn red">${L('Simpan webhook','Simpan webhook')}</button>${Store.mode==='remote'?`<span class="chip butter" style="white-space:normal">${L('Versi Claude tidak boleh hantar ke Discord. Guna versi Netlify.','Versi Claude tidak bisa kirim ke Discord. Pakai versi Netlify.')}</span>`:''}</div></form>
 <div class="grid g2" style="align-items:start"><div class="card"><div class="card-h"><h3 class="grow">Laporan bug</h3><span class="chip red">${bugs.filter(b=>b.status!=='selesai').length} ${L('terbuka','terbuka')}</span></div>${bugs.length?`<div class="list">${bugs.map(b=>`<div class="li" style="align-items:flex-start;${b.status==='selesai'?'opacity:.55':''}"><span style="font-size:20px">🐞</span><div class="grow"><b>${esc(b.page)}</b><div style="font-size:13px">${esc(b.text)}</div><div class="muted" style="font-size:12px">${esc(nameOf(b.by))} · ${fmtDT(b.at)}</div></div><button class="btn sm ${b.status==='selesai'?'ghost':'mint'}" data-bug="${esc(b.id)}">${b.status==='selesai'?L('Buka semula','Buka lagi'):L('Selesai','Selesai')}</button></div>`).join('')}</div>`:'<div class="empty">Tiada bug dilaporkan 🎉</div>'}</div>
 <div class="card"><h3 style="margin-bottom:10px">Log aktiviti</h3><div class="list" style="max-height:520px;overflow:auto">${S.log.slice(0,80).map(l=>`<div style="font-size:13px;padding:6px 0;border-bottom:1.5px dashed var(--line)"><span class="muted">${fmtDT(l.at)}</span> · <b>${esc(nameOf(l.actor))}</b> <span class="chip" style="font-size:10px;padding:1px 6px">${esc(SHORT[l.role]||l.role)}</span> ${esc(l.action)} ${l.target?`<b>${esc(l.target)}</b>`:''}</div>`).join('')||'<div class="empty">Log kosong</div>'}</div></div></div>`;
 $$('[data-whshow]').forEach(b=>b.onclick=()=>{const i=$(`[data-wh="${b.dataset.whshow}"]`);i.type=i.type==='password'?'text':'password'});
 $$('[data-whtest]').forEach(b=>b.onclick=()=>{const k=b.dataset.whtest;const v=$(`[data-wh="${k}"]`).value.trim();if(!WH_RE.test(v)){toast(L('URL webhook tidak sah','URL webhook tidak valid'),'err');return}sendDiscord(k,`🩺 ${L('Ujian sambungan KKB-HUB','Tes koneksi KKB-HUB')} → ${WH_KEYS.find(x=>x[0]===k)[1]} ✓`,null,false,v)});
 $('#whf').onsubmit=async e=>{e.preventDefault();const d={};for(const [k] of WH_KEYS){const v=$(`[data-wh="${k}"]`).value.trim();if(v&&!WH_RE.test(v)){toast(L('URL webhook tidak sah untuk ','URL webhook tidak valid untuk ')+k,'err');return}d[k]=v}
  for(const k of ['babl','kp','tp']){const v=$('#ri_'+k).value.trim();if(v&&!/^\d{15,22}$/.test(v)){toast(L('ID role mesti nombor sahaja','ID role harus angka saja'),'err');return}d['role_'+k]=v}
  if(await safe(Store.set('content/webhooks',d),L('Webhook disimpan','Webhook disimpan')))logAct('kemas kini webhook Discord')};
 $('#va').onchange=e=>{S.viewAs=e.target.value||null;toast(S.viewAs?L('Kini melihat sebagai ','Sekarang melihat sebagai ')+S.viewAs:L('Kembali ke akses penuh','Kembali ke akses penuh'));location.hash='#dashboard';rerender(true)};
 $('#exp').onclick=()=>copy(JSON.stringify({staff:S.staff.map(({avatar,...r})=>r),iban:S.iban,cuti:S.cuti,resign:S.resign,rekom:S.rekom,evals:S.evals,kawalan:S.kawalan,bugs:S.bugs},null,1),'Data disalin');
 $('#clrChat').onclick=()=>modal(`<h3>Kosongkan semua chat?</h3><p class="muted" style="margin:8px 0 14px">${S.chat.length} ${L('mesej akan dipadam dan tidak boleh dikembalikan.','pesan akan dihapus dan tidak bisa dikembalikan.')}</p><div class="row"><button class="btn red" id="yes">Padam semua</button><button class="btn ghost" data-close>Batal</button></div>`,(m,close)=>{$('#yes',m).onclick=async()=>{for(const c of S.chat)await Store.del('chat/'+c.id);toast('Chat dikosongkan','ok');close()}});
 $('#clrLog').onclick=()=>modal(`<h3>Kosongkan log?</h3><p class="muted" style="margin:8px 0 14px">${S.log.length} ${L('rekod akan dipadam. Pemantauan KP & TP bergantung pada log ini.','catatan akan dihapus. Pemantauan KP & TP bergantung pada log ini.')}</p><div class="row"><button class="btn red" id="yes">Padam log</button><button class="btn ghost" data-close>Batal</button></div>`,(m,close)=>{$('#yes',m).onclick=async()=>{for(const c of S.log)await Store.del('log/'+c.id);toast('Log dikosongkan','ok');close()}});
 $('#rstDemo')&&($('#rstDemo').onclick=()=>{Store.data=demoSeed();Store.save();Store._emit();toast('Demo direset','ok')});
 $$('[data-bug]').forEach(b=>b.onclick=()=>{const g=S.bugs.find(x=>x.id===b.dataset.bug);safe(Store.update('bugs/'+g.id,{status:g.status==='selesai'?'terbuka':'selesai'}),'Status bug dikemas kini')});
};
function bugModal(){modal(`<h3>Lapor bug 🐞</h3><p class="muted" style="margin:6px 0 12px">Laporan terus ke developer KKB-HUB.</p><form class="stack"><div class="field"><label for="bt">Apa yang tak kena?</label><textarea id="bt" required placeholder="cth: Butang simpan di bilik kawalan tak berfungsi"></textarea></div><div class="row"><button class="btn red">Hantar</button><button type="button" class="btn ghost" data-close>Batal</button></div></form>`,
 (m,close)=>{$('form',m).onsubmit=async e=>{e.preventDefault();if(await safe(Store.add('bugs',{by:S.me.id,page:current(),text:$('#bt',m).value.trim(),status:'terbuka',at:now()}),'Terima kasih! Bug dilaporkan'))close()}})}

setInterval(()=>{const c=document.getElementById('myClock');if(c)c.textContent='🕒 '+hm(new Date())+' MYT'},15000);
/* Halaman hanya dilukis semula bila data yang ia guna berubah, supaya form yang sedang diisi tidak hilang */
const DEPS={game:[],rekap:['shifts','kawalan','staff'],dashboard:['kawalan','cuti','announce','suara','staff'],kawalan:['kawalan','kawalanLog','staff','webhooks'],pukat:['pukat','staff','webhooks'],storage:['storage','pukat','staff','webhooks'],chat:['staff'],diskusi:['staff'],suara:['suara'],
 sop:[],uniform:['uniform'],kos:[],chart:['staff'],akkb:[],cuti:['cuti','webhooks'],resign:['resign','webhooks'],iban:['iban','staff'],profil:['staff','cuti','kawalanLog','evals'],
 bimbingan:['bimbingan','staff'],evaluasi:['evals','staff'],permohonan:['cuti','resign','staff'],staff:['staff'],pantau:['log','pimpinan','staff'],dev:['bugs','log','webhooks','staff']};
function onData(col){if(!S.loaded||!S.me)return;const d=DEPS[current()];if(!d||d.includes(col))rerender();else{const nb=$('.nav');if(nb&&['cuti','resign','bugs'].includes(col)){$$('.nav a').forEach(a=>{const id=a.getAttribute('href').slice(1);const n=badgeFor(id);let b=$('.badge',a);if(n){if(!b){b=document.createElement('span');b.className='badge';a.append(b)}b.textContent=n}else if(b)b.remove()})}}}
/* ---------------- boot ---------------- */
(async function boot(){
 renderLogin();
 await Store.init();
 let first=true;const timer=setTimeout(()=>{if(!S.loaded){const m=$('#lmsg');m&&(m.textContent='Data belum dapat dicapai. Semak sambungan, kemudian cuba lagi.')}},10000);
 const touch=()=>{const wasLoaded=S.loaded&&!!$('.shell');if(!S.loaded){S.loaded=true;clearTimeout(timer);const sid=LS.get('kkb_session',null);const s=S.staff.find(x=>x.id===sid&&x.active!==false);if(s){S.me=s}}
  if(S.me){const fresh=staffById(S.me.id);if(!fresh||fresh.active===false){S.me=null;LS.set('kkb_session',null)}else S.me=fresh}
  if(S.me){if(!wasLoaded)rerender();else onData('staff')}else if(first){first=false;const m=$('#lmsg');m&&(m.textContent='')}};
 Store.watchCol('staff',{},d=>{S.staff=d;touch()});
 Store.watchCol('iban',{},d=>{S.iban=Object.fromEntries(d.map(x=>[x.id,x]));onData('iban')});
 Store.watchCol('pukat',{},d=>{S.pukat=d;onData('pukat')});
 Store.watchCol('storage',{orderBy:'at',dir:'desc',limit:200},d=>{S.storage=d;onData('storage')});
 Store.watchCol('cuti',{},d=>{S.cuti=d;onData('cuti')});
 Store.watchCol('resign',{},d=>{S.resign=d;onData('resign')});
 Store.watchCol('rekom',{},d=>{S.rekom=d;onData('rekom')});
 Store.watchCol('bugs',{},d=>{S.bugs=d;onData('bugs')});
 Store.watchCol('bimbingan',{},d=>{S.bimbingan=Object.fromEntries(d.map(x=>[x.id,x]));onData('bimbingan')});
 Store.watchCol('evals',{},d=>{S.evals=Object.fromEntries(d.map(x=>[x.id,x]));onData('evals')});
 Store.watchCol('pimpinan',{},d=>{S.pimpinan=Object.fromEntries(d.map(x=>[x.id,x]));onData('pimpinan')});
 Store.watchCol('kawalanLog',{orderBy:'at',dir:'desc',limit:30},d=>{S.kawalanLog=d;onData('kawalanLog')});
 Store.watchCol('log',{orderBy:'at',dir:'desc',limit:300},d=>{S.log=d;onData('log')});
 Store.watchCol('leadchat',{orderBy:'at',dir:'desc',limit:150},d=>{const newer=d.filter(m=>m.at>(S.leadchat[0]?.at||0)&&m.by!==S.me?.id).length;const had=S.leadchat.length;S.leadchat=d;if(had&&newer&&isLeadGroup(S.me?.role))Snd.play('msg');if(current()==='diskusi')renderChatList()});
 Store.watchCol('shifts',{orderBy:'start',dir:'desc',limit:1000},d=>{S.shifts=d;onData('shifts')});
 Store.watchCol('snake',{},d=>{S.snake=d;if(current()==='game'&&typeof renderSnakeBoard==='function')renderSnakeBoard()});
 Store.watchCol('suara',{orderBy:'at',dir:'desc',limit:120},d=>{S.suara=d;onData('suara')});
 Store.watchCol('announce',{orderBy:'at',dir:'desc',limit:50},d=>{S.announce=d;onData('announce')});
 Store.watchCol('chat',{orderBy:'at',dir:'desc',limit:120},d=>{const newer=d.filter(m=>m.at>(S.chat[0]?.at||0)&&m.by!==S.me?.id).length;const had=S.chat.length;S.chat=d;if(had&&newer)Snd.play('msg');if(current()==='chat')renderChatList();});
 Store.watchDoc('kawalan/current',d=>{S.kawalan=d;reconcileDuty(d);onData('kawalan')});
 Store.watchDoc('content/app',d=>{const v=(d&&d.version)||'';if(v<APP_VERSION){Store.set('content/app',{version:APP_VERSION,at:now()}).catch(()=>{})}else if(v>APP_VERSION&&!$('#newVer')){const n=document.createElement('button');n.id='newVer';n.className='newver';n.textContent='🔄 '+L('Versi baru KKB-HUB tersedia. Tekan untuk muat semula','Versi baru KKB-HUB tersedia. Tekan untuk memuat ulang');n.onclick=()=>location.reload();document.body.append(n)}});
 Store.watchDoc('kawalan/duty',d=>{S.duty={map:(d&&d.map)||{},at:(d&&d.at)||0,loaded:true};reconcileDuty(S.kawalan);onData('kawalan')});
 Store.watchDoc('content/uniform',d=>{S.uniform=d;onData('uniform')});
 Store.watchDoc('content/webhooks',d=>{const {id,...rest}=d||{};S.webhooks=rest;onData('webhooks')});
})();
</script>
